<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Weather App — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;text-align:center}.card{max-width:480px;padding:40px 28px;border:1px solid #e2e8f0;border-radius:24px;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.08)}.icon{font-size:4rem;margin-bottom:16px}.card h1{margin:0 0 12px}.card p{margin:0 0 24px;color:#64748b;line-height:1.6}button{border:0;border-radius:10px;padding:12px 20px;background:#2563eb;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">☁️</div>
    <h1>You're offline</h1>
    <p>The Weather App can't reach the network right now. Reconnect to the internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
